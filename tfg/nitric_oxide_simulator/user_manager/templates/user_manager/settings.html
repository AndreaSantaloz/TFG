{% extends 'base.html' %}
{% load static %}

{% block css %}
    {{ block.super }}
    <link href="{% static 'user_manager/css/settings.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"> 
{% endblock %}

{% block content %}
<section id="back" aria-label="Back navigation">
    <a id="back" onclick="window.history.back()" role="button" tabindex="0" aria-label="Go back">
        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>
</section>

<section id="menu-setting" aria-labelledby="settings-title">
    <h1 id="settings-title">Settings</h1>
    <button id="delete_account" type="button" class="button_setting" aria-label="Delete account" onclick="deleteAccount()">Delete Account</button>
    <a id="logout_d" href="{% url 'logout' %}" >Logout</a>
</section>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function deleteAccount(){
     Swal.fire({
        title: 'Are you sure you want to delete your account?',
        html: `
             <form id="save-django-form" aria-label="Delete account form" method="POST" action="{% url 'delete_account' %}">
                {% csrf_token %}
                <input type="hidden" name="id_save">
            </form>
        `,
        confirmButtonText: 'Delete Account',
        cancelButtonText: 'Return',
        showCancelButton: true,
        confirmButtonColor: '#5b1109',
        cancelButtonColor: '#d9e1e7',
    }).then((result) => {
        if (result.isConfirmed) {
            document.getElementById('save-django-form').submit();
        }
    });
}
</script>
{% endblock %}
