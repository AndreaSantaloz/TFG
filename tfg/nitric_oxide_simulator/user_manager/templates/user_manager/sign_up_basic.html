{% extends 'base.html' %}
{% load static %}
  {% block css %}
            {{block.super}}
           <link href="{% static 'user_manager/css/authentication.css' %}" rel="stylesheet"> 
  {% endblock %}
   {%block content%}
   <!--El formulario es demasiado largo bro-->
   <div id ="authentication-container">
      <div>
        <h1>SIGN UP</h1>
      </div>
      <form id ="authentication-form" action="{% url 'sign_up_academic'%}" method="get">
         {% csrf_token %}
        <label>Name</label>
        <input type="text" name="name" placeholder="pepe">
        <label>Email</label>
        <input type="email" name="email" placeholder="pepe@gmail.com">
        <label>Institution</label>
        <input type="text" name="institution" placeholder="ulpgc">
        <button type="submit">Next Page</button>
      </form>
      <p>If you  have an account you can login  in this <a href="{% url 'login' %}">link</a></p>
      
   </div>
   {% endblock %}
