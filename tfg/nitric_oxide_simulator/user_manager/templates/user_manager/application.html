{% extends 'base.html' %}
{% load static %}
  {% block css %}
            {{block.super}}
            <link href="{% static 'user_manager/css/authentication.css' %}" rel="stylesheet"> 
  {% endblock %}
   {%block content%}
   <div id ="authentication-container">
      <div>
        <h1>{{title}}</h1>
      </div>
      <form id ="authentication-form">
        {% csrf_token %}
        <label>Write your email for {{action}}</label>
        <input type="email" name="email" placeholder="pepe@gmail.com">
        <div id="section-signup-form">
          <button onclick="window.history.back()">Return</button>
          <button type="submit">Enter</button>
        </div>
      </form>
   </div>
   {% endblock %}
