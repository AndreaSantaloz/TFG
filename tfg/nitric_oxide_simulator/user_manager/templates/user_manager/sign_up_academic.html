{% extends 'base.html' %}
{% load static %}
  {% block css %}
            {{block.super}}
           <link href="{% static 'user_manager/css/authentication.css' %}" rel="stylesheet"> 
  {% endblock %}
   {%block content%}
   <div id ="authentication-container" aria-labelledby="signup-academic-title">
      <div>
        <h1 id="signup-academic-title">SIGN UP</h1>
      </div>
      <form id ="authentication-form" method="post" aria-labelledby="signup-academic-title">
         {% csrf_token %}
         <label for="institution">Institution</label>
        <input id="institution" type="text" name="institution" placeholder="ulpgc">
        <label for="researchfield">Research field</label>
        <input id="researchfield" type="text" name="researchfield" placeholder=" Computacional Neuroscience">
        <label for="researcharea">Research area</label>
        <input id="researcharea" type="text" name="researcharea" placeholder="brain movement">
        <div id="section-signup-form">
          <button type="button" onclick="window.history.back()">Return</button>
          <button type="submit">Enter</button>
        </div>
        
      </form>
      <p>If you  have an account you can login  in this <a href="{% url 'login' %}">link</a></p>
      
   </div>
   {% endblock %}
