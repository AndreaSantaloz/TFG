{% extends 'base.html' %}
{% load static %}
  {% block css %}
            {{block.super}}
            <link href="{% static 'user_manager/css/authentication.css' %}" rel="stylesheet"> 
  {% endblock %}
   {%block content%}
   <div id ="authentication-container">
      <div>
        <h1>LOGIN</h1>
      </div>
      <form id ="authentication-form" method="post">
        {% csrf_token %}
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="pepe@gmail.com">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="12345678">
        <button type="submit">Enter</button>
      </form>
      <p>If you don't have an account you can create an account in this <a href="{% url 'sign_up' %}">link</a></p>
      <p>Have you lost your password?Click on this <a href="{%url 'recover_password'%}">link</a></p>
   </div>
   {% endblock %}
