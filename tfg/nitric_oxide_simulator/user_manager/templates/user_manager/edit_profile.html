{% extends 'base.html' %}
{% load static %}

{% block css %}
    {{ block.super }}
    <link href="{% static 'user_manager/css/user_profile.css' %}" rel="stylesheet"> 
{% endblock %}

{% block content %}
<div id="profile">
    
    <div id="buttons" style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
        <a class="edit-btn" onclick="window.history.back()" style="cursor: pointer; display: flex; align-items: center;" title="Volver atrás">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>

        <button  type="submit" form="profile-form" class="edit-btn" style="display: flex; align-items: center;" title="Editar perfil">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
        </button >
    </div>

    <section id="profile-panel">
        <div id="user">
            <div id="userdata">
                <form method="POST" action="" id="profile-form">
                    {% csrf_token %}
                    
                    <label>
                        {% if name %} <b>Name</b>  {% else %} <b>Name</b> {% endif %}
                    </label>
                    <input type="text" name="name" value="{{ name|default:'' }}" >
                    
                    <label>
                         <b>Email</b>: {{ email }} 
                    </label>
                    <input type="email" name="email" value="{{ email|default:'' }}" disabled>
                    
                    <label>
                        {% if institution %} <b>Institución</b>: {{ institution }} {% else %} <b>Institution</b> {% endif %}
                    </label>
                    <input type="text" name="institution" value="{{ institution|default:'' }}" >
                    
                    <label>
                        {% if researchfield %} <b>Research Field</b>: {{ researchfield }} {% else %} <b>Research Field</b> {% endif %}
                    </label>
                    <input type="text" name="researchfield" value="{{ researchfield|default:'' }}" >
                    
                    <label>
                        {% if researcharea %} <b>Research Area</b>: {{ researcharea }} {% else %} <b>Research Area</b> {% endif %}
                    </label>
                    <input type="text" name="researcharea" value="{{ researcharea|default:'' }}" >
                </form>
            </div>
        </div>

        <div id="area-texto">
            <div id="aboutme">
                <h1>About me </h1>
                <textarea name="aboutme" rows="20" cols="100" form="profile-form">{{ aboutme|default:'' }}</textarea>
            </div>
            <div id="researchs">
                <h1>Researchs</h1>
                <textarea name="researchs" rows="20" cols="100" form="profile-form">{{ researchs|default:'' }}</textarea>
            </div>
        </div>
    </section>
    
  
</div>
{% endblock %}
