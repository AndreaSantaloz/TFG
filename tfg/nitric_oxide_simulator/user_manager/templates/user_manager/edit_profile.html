{% extends 'base.html' %}
{% load static %}

{% block css %}
    {{ block.super }}
    <link href="{% static 'user_manager/css/user_profile.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div id="profile" aria-labelledby="edit-profile-title">
    
    <div id="buttons" role="toolbar" aria-label="Edit profile actions" style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
        <a class="edit-btn" onclick="window.history.back()" role="button" tabindex="0" aria-label="Go back" style="cursor: pointer; display: flex; align-items: center;" title="Volver atras">
            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>

        <button type="submit" form="profile-form" class="edit-btn" aria-label="Save profile changes" style="display: flex; align-items: center;" title="Editar perfil">
            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
        </button>
    </div>

    <section id="profile-panel" aria-labelledby="edit-profile-title">
        <div id="user">
            <div id="userdata">
                <form method="POST" action="" id="profile-form" aria-labelledby="edit-profile-title">
                    {% csrf_token %}
                    <h1 id="edit-profile-title">Edit profile</h1>
                    
                    <label for="name">
                        {% if name %} <b>Name</b>  {% else %} <b>Name</b> {% endif %}
                    </label>
                    <input id="name" type="text" name="name" value="{{ name|default:'' }}">
                    
                    <label for="email">
                         <b>Email</b>: {{ email }}
                    </label>
                    <input id="email" type="email" name="email" value="{{ email|default:'' }}" disabled aria-disabled="true">
                    
                    <label for="institution">
                        {% if institution %} <b>Institution</b>: {{ institution }} {% else %} <b>Institution</b> {% endif %}
                    </label>
                    <input id="institution" type="text" name="institution" value="{{ institution|default:'' }}">
                    
                    <label for="researchfield">
                        {% if researchfield %} <b>Research Field</b>: {{ researchfield }} {% else %} <b>Research Field</b> {% endif %}
                    </label>
                    <input id="researchfield" type="text" name="researchfield" value="{{ researchfield|default:'' }}">
                    
                    <label for="researcharea">
                        {% if researcharea %} <b>Research Area</b>: {{ researcharea }} {% else %} <b>Research Area</b> {% endif %}
                    </label>
                    <input id="researcharea" type="text" name="researcharea" value="{{ researcharea|default:'' }}">
                </form>
            </div>
        </div>

        <div id="area-texto">
            <div id="aboutme" aria-labelledby="aboutme-title">
                <h1 id="aboutme-title">About me</h1>
                <textarea name="aboutme" rows="20" cols="100" form="profile-form" aria-labelledby="aboutme-title">{{ aboutme|default:'' }}</textarea>
            </div>
            <div id="researchs" aria-labelledby="researchs-title">
                <h1 id="researchs-title">Researchs</h1>
                <textarea name="researchs" rows="20" cols="100" form="profile-form" aria-labelledby="researchs-title">{{ researchs|default:'' }}</textarea>
            </div>
        </div>
    </section>
    
  
</div>
{% endblock %}
