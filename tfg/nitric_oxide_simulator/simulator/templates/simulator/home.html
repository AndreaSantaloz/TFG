{% extends 'base.html' %}
{% load static %}
{% block css %}
            {{block.super}}
            <link href="{% static 'simulator/css/home.css' %}" rel="stylesheet"> 
  {% endblock %}
  {%block content%}
   <div id="upload_data">
    <h1>Simulation</h1>
   <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          
          <div id="file_upload">
            <div>
               <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100" height="100" style="fill:#3498db;">
                <path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
            </svg>
            </div>
           
            <label for="file"> Maximum 1 file</label>
          </div>
         
        <input type="file" id="file" name="file">
        <button type="submit"><b>Simulate</b> </button>
   </form>
   </div>
  {% endblock%}
