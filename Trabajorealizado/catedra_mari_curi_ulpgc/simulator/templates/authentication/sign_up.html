            
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{% static 'css/general.css'%}">
        <link rel="stylesheet" href="{% static 'css/header.css'%}">
        <link rel="stylesheet" href="{% static 'css/authentication.css'%}">
        <link rel="icon" type="image/png" href="{% static 'images/brain.png' %}">
        <script src="{% static 'js/settings.js' %}" defer ></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src="{% static 'js/nav.js' %}" defer ></script>
        </head>
    <body>

        <header>
            <a id="home-button" class="image-button" href="{% url 'index'%}"><img src="{% static 'images/brain.png' %}" id="logo" width="20" height="20"  ></img></a>
            <nav>
                <a  id="contact-button" class="index-button"  href="{% url 'about_this_app' %}">About this app</a>
                <a  id="contact-button" class="index-button"  href="{% url 'help' %}">Help</a>
                <a  id="language-button" class="index-button"  href="{% url 'privacy_terms' %}">Privacity terms</a>
                <select  class="index-button" id="language" >
                            <option disabled selected hidden>Language</option>
                            <option >English</option>
                            <option> Spanish</option>
                </select>
                <div id="section-dark-mode-button">
                    <button id="darkmode-button"  onclick=changeMode() ></button>
                </div>     
            </nav>
        </header>
        <main>
        
            <section class="structure-presentation">
                <section id="information-presentation">
                    <h2>You are registered</h2>
                    <a  id="login-button"   class="button-signup" href="{% url 'login' %}">Go to Login</a>
                </section>
                <section id="section-form-signup">
                    <h1>Sign up</h1>
                    <form id="form-sign-up" method="post">
                        {% csrf_token %}
                    
                        <label>Name</label>
                        <input name="name" id="inputs" type="text" placeholder="pepe" required="True">
                        <label>Email</label>
                        <input name="email" id="inputs" type="email" placeholder="pepe@example.com" required="True">
                        <label>Institution</label>
                        <input name="institution" id="inputs" type="text" placeholder="ulpgc" required="True">
                        <label>ORCID</label>
                        <input name="orcid" id="inputs" type="number" placeholder="0000 0000 0000 0000" required="True">
                        <label>Area of specialization in neuroscience</label>
                        <select id="inputs" name="areas_of_specialization" required="True">
                            <option value="developmental_neurocience">Developmental neuroscience</option>
                            <option value="cognitive_neuroscience">Cognitive neuroscience</option>
                            <option value="molecular_and_cellular_neuroscience">Molecular and cellular neuroscience</option>
                            <option value="neurogenetics">Neurogenetics</option>
                            <option value="behavioral_neuroscience">Behavioral neuroscience</option>
                            <option value="clinicial_neuroscience">Clinical neuroscience</option>
                            <option value="neurophysiology">Neurophysiology</option>
                            <option value="sensory_neuroscience">Sensory neuroscience</option>
                        </select>
                        <label>Password</label>
                        <input name="password" id="inputs" type="password" placeholder="********" required="True">
                        <label>Confirm your password</label>
                        <input  name="confirm_password" id="inputs" type="password" placeholder="********" required="True">
                
                        <button type="submit" class="button-signup"><strong>Enter</strong></button>
                </form>
                </section>
            </section>
        </main>
        <footer>
            <div><span>For more information, please contact technical support</span></div>
        </footer> 
    </body>
</html>
