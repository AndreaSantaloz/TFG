
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'css/index.css'%}">
        <link rel="stylesheet" href="{% static 'css/general.css'%}">
        <link rel="stylesheet" href="{% static 'css/header.css'%}">
        <link rel="icon" type="image/png" href="{% static 'images/brain.png' %}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src="{% static 'js/nav.js' %}" defer ></script>
        <script src="{% static 'js/settings.js' %}" defer ></script>

        </head>
    <body>
        <header>
            <img src="{% static 'images/brain.png' %}" id="logo" width="20" height="20"  ></img>
            <nav>
                <a id="login-button" class="index-button" href="{% url 'login'%}">Login</a>
                <a  id="sign_up-button" class="index-button"  href="{% url 'sign_up' %}"><strong>Sign up</strong></a>
                <a  id="about-this-app-button" class="index-button"  href="{% url 'about_this_app' %}">About this app</a>
                <a  id="help-button" class="index-button"  href="{% url 'help' %}">Help</a>
                <a  id="language-button" class="index-button"  href="{% url 'privacy_terms' %}">Privacity terms</a>
                <select class="index-button"  id="language" >
                            <option disabled selected hidden>Language</option>
                            <option >English</option>
                            <option> Spanish</option>
                </select>
                <div id="section-dark-mode-button">
                    <button id="darkmode-button"  onclick=changeMode() ></button>
                </div>
            </nav>
            <div id="container">
                <div>
                    <img src="{% static 'images/ulpgc.png' %}" id="ulpgc" width="20" height="20"  ></img>
                </div>
                <div  id="etiq">
                    <!--Separar-->
                        <span>comciencia Instituto Universitario de Cibérnetica , Empresa y Sociedad</span>
                </div>
            </div>
        </header>
        <main> 
        </main>
        <footer>
            <div><span>For more information, please contact technical support</span></div>
        </footer>

    </body>
</html>
