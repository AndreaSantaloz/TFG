
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/simulator.css'%}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src='https://cdn.plot.ly/plotly-3.3.0.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js'></script>
        <script src="{% static 'simulator/js/dispersion_charts.js' %}" defer></script>
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>

    </head>
    <body>
        <header id="header-app">
           <div>
                <img  src="" id="user_photo"  >
           </div>
          
            <nav>
                <ul id="button-orden">
                <li><button  id="dashboard-button" data-url="{% url 'simulator'%}">Icon Dashboard</button></li>
                <li><button  id="profile-button"  data-url="{% url 'profile'%}" >Icon Profile</button></li>
                <li><button  id="store-button" data-url="{% url 'store'%}">Icon Model Store</button></li>
                <li><button  id="tutorial-button" data-url="{% url 'tutorial' %}">Icon Tutorial</button></li>
                <li><button  id="setting-button" data-url="{% url 'setting' %}">Icon Setting</button></li>
                </ul>
            </nav>
        </header>
        <main>
            {% csrf_token %}
            <section id="second-header">
                <div id="title"><h1>Simulator</h1></div>
            </section>
            <section>
                  <nav class="charts_list">
                    <div><button id="tabular_chart" class="simulator_button" data-url="{%url 'tabular_chart'%}">Tabla de Datos</button></div>  
                    <div><button id="dispersion_chart" class="simulator_button" data-url="{%url 'dispersion_chart'%}">Gráficas de dispersión</button></div>  
                    <div><button id="correlation_chart" class="simulator_button" data-url="{%url 'correlation_chart'%}">Gráficas de correlación</button></div>
                     <div><button id="volumen_chart" class="simulator_button" data-url="{%url 'volume_charts'%}">Gráficas de volumen</button></div> 
                    <div><button id="error_chart" class="simulator_button" data-url="{%url 'erros_chart'%}" >Gráficas de validación</button></div>   
                </nav>
            </section>
         
            <br>
            <section id="dashboard-style">
                <div id="lineal_chart"></div>
                <div id="boxplot_chart"></div> 
                <div id="scatter_chart"></div>
            
            </section>
            
            
        </main>
        
        
       
    </body>
</html>
