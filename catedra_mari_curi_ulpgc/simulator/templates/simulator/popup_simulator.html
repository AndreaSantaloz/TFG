
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/general.css'%}">
        <link rel="stylesheet" href="{% static 'simulator/css/popup_simulator.css'%}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src='https://cdn.plot.ly/plotly-3.3.0.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js'></script>
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>

    </head>
    
    <body>
        {% csrf_token %}
          <form id="style-form">
            <section>
                <h1>Upload and simulate your model</h1>
            </section>
            
            <section id="lado-carga-modelo">
                <section>
                    <p>If you dont save your model uploading here your model.</p>
                </section>
                <section id="button-upload-computer">
                    <input type="file" id="archivo" name="archivo"/>
                    <label for="archivo">Upload Model from Computer</label>
                </section>
                <button>Simulate model</button>
            </section>
        </form>
        <button  id="return-button" data-url="{% url 'simulator'%}">Return home</button>
         <img id="imagen-fondo" src="../../static/simulator/images/ImagenFondo11.webp">
       
           
        
       
    </body>
    
</html>
