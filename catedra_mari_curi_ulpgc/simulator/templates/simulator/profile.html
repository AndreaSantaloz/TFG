
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/profile.css'%}">
        <link rel="stylesheet" href="{% static 'simulator/css/general.css'%}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src='https://cdn.plot.ly/plotly-3.3.0.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js'></script>
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>

    </head>
    
    <body>
        {% csrf_token %}
        <header>
            <nav >
                <div><button  id="dashboard-button" data-url="{% url 'simulator'%}">Icon Simulator</button></div>
                <div><button  id="store-button" data-url="{% url 'store'%}">Icon Model Store</button></div>
                <div><button  id="tutorial-button" data-url="{% url 'tutorial' %}">Icon Tutorial</button></div>
                <div><button  id="profile-button"  data-url="{% url 'profile'%}" >Icon Profile</button></div>
            </nav>
        </header>
        <main >
        <section id="information-user">
                <img  src="" id="photo_profile"/>
                <!---Aquí el backend pondrá el nombre del usuario-->
                <section id="data-user">
                    <div><h1>{{name}}</h1></div>
                    <section>
                        <ul id="info">
                            <li id="email-user"><span>Email:{{email}}</span></li>
                            <li id="phone-user"><span>Phone: {{phone}}</span></li>
                            <li id="social-media-user"><span>Social Media: {{social_media}}</span></li>
                        </ul>
                    </section>
                    <section id="about-user">
                        <h1>About Me</h1>
                        <input id="description" type="textarea" placeholder="My name is Pepe and my passion is learning new things."/>
                    </section>
                    <section id="researchs-user">
                        <h1>Researchs</h1>
                        <input id="researchs" type="textarea" placeholder="I have researched many works.For example, the neuron in the brain(1998)"/>
                    </section>
                </section>
        </section>
        </main>
        <footer>
            <div><span>Para más información consultar al servicio tecnico</span></div>
        </footer>
    </body>
</html>
