
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/profile.css'%}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src='https://cdn.plot.ly/plotly-3.3.0.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js'></script>
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>

    </head>
    
    <body>
        {% csrf_token %}
        <header id="header-app">
           <div>
                <img  src="" id="user_photo"  >
           </div>
          
            <nav>
                <ul id="button-orden">
                <li><button  id="dashboard-button" data-url="{% url 'simulator'%}">Icon Simulator</button></li>
                <li><button  id="profile-button"  data-url="{% url 'profile'%}" >Icon Profile</button></li>
                <li><button  id="store-button" data-url="{% url 'store'%}">Icon Model Store</button></li>
                <li><button  id="tutorial-button" data-url="{% url 'tutorial' %}">Icon Tutorial</button></li>
                <li><button  id="setting-button" data-url="{% url 'setting' %}">Icon Setting</button></li>
                </ul>
            </nav>
        </header>
        <main >
          <section id="information-user">
                <img  src="" id="photo_profile"/>
                <!---Aquí el backend pondrá el nombre del usuario-->
                <section id="data-user">
                    <div><h1>Manola</h1></div>
                    <div>
                        <ul>
                            <li id="email-user">Email: manola@example.com</li>
                            <li id="phone-user">Phone: 666 66 89 19</li>
                            <li id="social-media-user">Social Media: #manola</li>
                        </ul>
                    </div>
                    
                </section>
                
                
                
               
          </section>
          <section id="about-user">
            <h1>About Me</h1>
            <input id="description" type="textarea" placeholder="My name is Pepe and my passion is learning new things."/>
          </section>

           <section id="researchs-user">
            <h1>Researchs</h1>
             <input id="researchs" type="textarea" placeholder="I have researched many works.For example, the neuron in the brain(1998)"/>
          </section>
            
            
        </main>
        
        
       
    </body>
</html>
