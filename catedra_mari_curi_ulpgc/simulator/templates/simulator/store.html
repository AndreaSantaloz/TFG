
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/general.css'%}">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

                        <div class="cell-models-table"><span>.tft</span></div>
                        <div class="cell-models-table"><span>10:10:20</span></div>
                    </section>
