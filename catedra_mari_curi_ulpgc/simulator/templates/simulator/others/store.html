
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/general.css'%}">
        <link rel="stylesheet" href="{% static 'simulator/css/store.css'%}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src='https://cdn.plot.ly/plotly-3.3.0.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js'></script>
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>
        <script src="{% static 'simulator/js/store.js' %}" defer ></script>

    </head>
    
    <body>
        {% csrf_token %}
        <header>
            <img src="../../static/simulator/images/Logo.jpg" id="logo"  />
            <nav >
                <div><button  id="dashboard-button" data-url="{% url 'home'%}"> Simulator</button></div>
                <div><button  id="store-button" data-url="{% url 'store'%}"> Model Store</button></div>
                <div><button  id="tutorial-button" data-url="{% url 'tutorial' %}"> Tutorial</button></div>
                <div><button  id="profile-button"  data-url="{% url 'profile'%}" > Profile</button></div>
            </nav>
        </header>
        <main >

            <section id="menu-store" >
                <section id="menu-store-buttons">
                    <div>
                        <button id="add-button" data-url="{% url 'popup_store'%}" class="sytle-button-store" >Add model</button>
                    </div>
                    <div>
                        <button id="delete-button" data-url="{% url 'popup_store'%}" class="sytle-button-store">Delete model</button>
                    </div>
                     <div>
                        <button id="update-button" data-url="{% url 'popup_store'%}"  class="sytle-button-store">Update model</button>
                    </div>
                    <div>
                        <button id="simulate-button" data-url="{% url 'popup_simulator'%}"  class="sytle-button-store">Simulate model</button>
                    </div>
                </section>
               
                    
            </section>

            <section id="collection-models">
                <section id="collection-models-header">
                    <div class="cell-models-table"><span>Name Model</span></div>
                    <div class="cell-models-table"><span>Author</span></div>
                    <div class="cell-models-table"><span>Format</span></div>
                    <div class="cell-models-table"><span>Last Accesed</span></div>
                </section>
                <!--Hacer un checkbox para seleccionar el modelo que se va a ejecutar-->
                <!--Hacer barra de movimiento para varios modelos limit 15-->
                <!--Cambiar aquí cuando termine el diseño para asociarlo a la BD-->
                <section>
                    <!--Esto es lo que será automatizado-->
                    <section class="collection-models-cells">
                        <div class="cell-models-table"><span>Comparmental model</span></div>
                        <div class="cell-models-table"><span>Pepe</span></div>
                        <div class="cell-models-table"><span>.tft</span></div>
                        <div class="cell-models-table"><span>10:10:20</span></div>
                    </section>

                     <section class="collection-models-cells">
                        <div class="cell-models-table"><span>Comparmental model</span></div>
                        <div class="cell-models-table"><span>Pepe</span></div>
                        <div class="cell-models-table"><span>.tft</span></div>
                        <div class="cell-models-table"><span>10:10:20</span></div>
                        </section>
                    </section>

                     <section class="collection-models-cells">
                        <div class="cell-models-table"><span>Comparmental model</span></div>
                        <div class="cell-models-table"><span>Pepe</span></div>
                        <div class="cell-models-table"><span>.tft</span></div>
                        <div class="cell-models-table"><span>10:10:20</span></div>
                    </section>

                     <section class="collection-models-cells">
                        <div class="cell-models-table"><span>Comparmental model</span></div>
                        <div class="cell-models-table"><span>Pepe</span></div>
                        <div class="cell-models-table"><span>.tft</span></div>
                        <div class="cell-models-table"><span>10:10:20</span></div>
                    </section>


            </section>
         
        <img id="imagen-fondo" src="../../static/simulator/images/ImagenFondo15.jpg">
        </main>
         <footer>
            <div><span>Para más información consultar al servicio tecnico</span></div>
        </footer>
        
       
    </body>
</html>
