
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/general.css'%}">
        <link rel="stylesheet" href="{% static 'simulator/css/simulator.css'%}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src='https://cdn.plot.ly/plotly-3.3.0.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js'></script>
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>

    </head>
    
    <body>
        {% csrf_token %}
        <header>
           
            <img src="../../static/simulator/images/Logo.jpg" id="logo"  />

            <!--Cambio de diseño lo del pop pup se pondra en el home y si solo se verá el simulator en las demás páginas-->
            <nav>
               
                <button  id="store-button" data-url="{% url 'store'%}"> Model Store</button>
                <button  id="tutorial-button" data-url="{% url 'tutorial' %}"> Tutorial</button>
                <button  id="profile-button"  data-url="{% url 'profile'%}" > Profile</button>
            </nav>
        </header>
        <main>

               <section class="structure-presentation">
                <section id="information-presentation">
                    <h1>Upload and simulate your model</h1>
                </section>
                <section id="section-form-upload-model">
                     <form id="form-upload-model"  enctype="multipart/form-data" method="post" id="form-simulator">
                        {% csrf_token %}
                         <section class="tile">
                            <label for="archivo"><h2>Insert your input data</h2></label>
                        </section>
                        <section>
                            <input type="file" id="archivo" name="archivo"/>
                            <label class="button-upload-computer" for="archivo">Upload input data</label><br>
                        </section>
                        <section class="tile">
                            <label for="archivo"><h2>Insert your model</h2></label>
                        </section>
                        <section>
                            <input type="file" id="archivo2" name="archivo2"/>
                            <label class="button-upload-computer" for="archivo2">Upload your model</label><br>
                        </section>
                            <button id="simulate-button" type="submit">Simulate </button>
                        </section>
                    </form>
                </section>
            </section>

        <img id="imagen-fondo" src="../../static/simulator/images/ImagenFondo15.jpg">
            
        </main>
        <footer>
            <div><span>Para más información consultar al servicio tecnico</span></div>
        </footer>
      
        
       
    </body>
</html>
