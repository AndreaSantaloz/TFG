
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/general.css'%}">
        <link rel="stylesheet" href="{% static 'simulator/css/setting.css'%}">
        <script src='https://cdn.plot.ly/plotly-3.3.0.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js'></script>
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>

    </head>
    
    <body>
        {% csrf_token %}
        <header>
            <nav >
                <div><button  id="dashboard-button" data-url="{% url 'home'%}">Icon Simulator</button></div>
                <div><button  id="store-button" data-url="{% url 'store'%}">Icon Model Store</button></div>
                <div><button  id="tutorial-button" data-url="{% url 'tutorial' %}">Icon Tutorial</button></div>
                <div><button  id="profile-button"  data-url="{% url 'profile'%}" >Icon Profile</button></div>
            </nav>
        </header>
        <main >
           
            <section id="collection-models">
                 <h1>Settings</h1>
                <!--Cambiar aquí cuando termine el diseño para asociarlo a la BD-->
                <section>
                    <!--Esto es lo que será automatizado-->
                    <section class="collection-models-cells">
                        <div class="cell-models-table">
                            <button id = "modify-profile-button" class="setting-button">Modify profile</button>
                        </div>

                        <div class="cell-models-table">
                            <button  id = "change-mode-button"  class="setting-button">Change to black mode</button>
                        </div>

                        <div class="cell-models-table">
                            <button id="delete-account-button" class="setting-button">Delete Account</button>
                        </div>

                        <div class="cell-models-table">
                            <button id="exit-button" class="setting-button" data-url="{% url 'index'%}">Exit</button>
                        </div>
                        
                    </section>

                    


            </section>
            
        </main>
         <footer>
            <div><span>Para más información consultar al servicio tecnico</span></div>
        </footer>
        
    </body>
</html>
