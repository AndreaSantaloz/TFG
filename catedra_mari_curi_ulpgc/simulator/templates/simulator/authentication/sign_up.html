            
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/authentication.css'%}">
        <link rel="stylesheet" href="{% static 'simulator/css/general.css'%}">
         <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>
        </head>
    <body>

        <header></header>
        <main>

            <section class="structure-presentation">
                <section id="information-presentation">
                    <h2>You are registered</h2>
                    <button id="login-button" class="button-signup" data-url="{% url 'login' %}" >Go to Login</button>
                </section>
                <section id="section-form-signup">
                  
                     <h1>Sign up</h1>
                     <form id="form-sign-up" method="post">
                        {% csrf_token %}
                    
                        <label>Name</label>
                        <input name="name" id="inputs" type="text" placeholder="pepe">
                   
                        <label>Email</label>
                        <input name="email" id="inputs" type="email" placeholder="pepe@example.com">
                   
                        <label>Password</label>
                        <input name="password" id="inputs" type="password" placeholder="********">
                   
                        <label>Confirm your password</label>
                        <input  name="confirm_password" id="inputs" type="password" placeholder="********">
                
                        <button type="submit" class="button-signup">Enter</button>
                 
                </form>
                </section>
                 
            </section>
       
        </main>
        <footer>
</footer>
       
        
    </body>
</html>
