
{% load static %}
<!DOCTYPE html>                         
<html>
    <head>
        <link rel="stylesheet" href="{% static 'simulator/css/simulator.css'%}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <script src='https://cdn.plot.ly/plotly-3.3.0.min.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js'></script>
        <script src="{% static 'simulator/js/simulator.js' %}" defer></script>
        <script src="{% static 'simulator/js/nav.js' %}" defer ></script>

    </head>
    <body>
        <header id="header-app">
           <div>
                <img  src="" id="user_photo"  >
           </div>
          
            <nav>
                <ul id="button-orden">
                <li><button  id="dashboard-button" data-url="{% url 'simulator'%}">Icon Dashboard</button></li>
                <li><button  id="profile-button"  data-url="{% url 'profile'%}" >Icon Profile</button></li>
                <li><button  id="store-button" data-url="{% url 'store'%}">Icon Model Store</button></li>
                <li><button  id="setting-button" data-url="{% url 'setting' %}">Icon Setting</button></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="second-header">
                <div id="title"><h1>Simulator</h1></div>
                <div id="buton-charge">
                    <button id="charge-models" data-url="{% url 'upload_model' %}">Upload Models</button>
                </div>
            </section>
            <br>
            <section id="dashboard-style">
                <div id="lineal_chart"></div>
                <div id="boxplot_chart"></div>
                <div id="heatmap_chart"></div>
                <div id="scatter_chart"></div>
                <div id="table"></div>
            </section>
            
            
        </main>
        
        
       
    </body>
</html>
